# ─── Site Settings ───
# Professional facts (name, headline, experience, contacts) live in
# _data/profile.yml; SEO tags are rendered by _includes/seo.html.
title: "Alessandro Bragetti"
author: "Alessandro Bragetti"
email: "alessandro.bragetti17@gmail.com"
description: "Alessandro Bragetti — SAP BTP & Full Stack Developer (SAP CAP, Node.js, SAPUI5/Fiori, OData, SAP Integration Suite). Also exploring AI engineering and cybersecurity."
brand: "AI_SEC"          # logo mark in the navbar (kept from the original identity)
lang: en
baseurl: ""
url: "https://lordeassan.github.io"

og_image: "/assets/images/og-default.png"

# Kept for backwards compatibility; footer/JSON-LD now read _data/profile.yml.
social:
  - name: GitHub
    url: "https://github.com/LordEasSan"
  - name: LinkedIn
    url: "https://www.linkedin.com/in/alessandro-bragetti-a60447211/"
  - name: Email
    url: "mailto:alessandro.bragetti17@gmail.com"

# ─── Build Settings ───
theme: null
plugins:
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
highlighter: rouge

sass:
  sass_dir: assets/css
  style: compressed
  sourcemap: never

feed:
  collections:
    - posts

# ─── Collections ───
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  writeups:
    output: true
    permalink: /writeups/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: writeup
  - scope:
      path: ""
    values:
      layout: default

# ─── Excludes ───
# docs/ holds internal documentation (docs/career and docs/chatgpt-continuity
# are also git-ignored). The original full-resolution photo is not published;
# the site serves the resized assets/images/profile-*.{webp,jpg}.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - DEVELOPMENT.md
  - README.md
  - scripts
  - .github
  - .pa11yci.json
  - docs
  - assets/images/profile.jpg
  - assets/images/source

# ─── Dev Settings ───
# Drafts are shown only via `npm run dev` (--drafts), never in production.
livereload: true
