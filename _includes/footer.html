{%- assign c = site.data.profile.contact -%}
<footer class="site-footer">
  <div class="container">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }} · {{ site.data.profile.headline }}</p>
    <p class="muted footer-links">
      <a href="{{ c.linkedin }}" rel="noopener me">LinkedIn</a> &middot;
      <a href="{{ c.github }}" rel="noopener me">GitHub</a> &middot;
      <a href="mailto:{{ c.email }}">Email</a> &middot;
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
