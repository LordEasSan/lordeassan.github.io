<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Theme: apply the saved choice before first paint (no FOUC). Dark-first:
     with no saved choice the site is dark. localStorage can throw in some
     privacy modes, so access is guarded. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  })();
</script>
