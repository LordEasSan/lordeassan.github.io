# ─────────────────────────────────────────────────────────────
# certifications.yml — data model for /certifications/ and About.
# Add a new entry here; no layout change is needed.
#
# Fields
#   id            unique slug
#   title         display name
#   subtitle      optional one-liner
#   issuer        awarding body / provider
#   category      formal-certification | language-qualification |
#                 course-completion | training-course | self-directed
#   date          "YYYY-MM" or "YYYY" (leave empty if unknown — never guess)
#   skills        list of skill tags
#   credential_url  public verification link (optional)
#   verification  documented   = verified against a certificate/credential
#                 declared     = stated by me, document not inspected here
#                 listed-on-cv = appears in my CV, completion evidence not inspected
#   image         optional privacy-safe image path (NO candidate numbers,
#                 signatures, dates of birth or QR codes)
#   public        false hides the entry from the site
#
# Privacy: never publish certificate/candidate numbers or full scans.
# ─────────────────────────────────────────────────────────────

