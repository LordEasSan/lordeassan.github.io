<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="graph-bg" aria-hidden="true"></canvas>

  {% include navbar.html %}

  <main id="main" class="container">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- theme (toggle + mobile nav) → background graph → page scripts -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/graph.js' | relative_url }}" defer></script>
  {% if page.scripts contains 'projects' %}<script src="{{ '/assets/js/projects.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
